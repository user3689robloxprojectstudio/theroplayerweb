<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | TheRoPlayer Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #07090e; --surface: rgba(30, 41, 59, 0.7); --primary: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(7, 9, 14, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; z-index: 1000; }
        .nav-logo { font-size: 1.25rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 25px; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
        .nav-links a:hover { color: var(--primary); }

        .main-content { max-width: 800px; width: 100%; margin: 130px auto 60px auto; padding: 0 20px; flex: 1; }
        .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 35px; margin-bottom: 30px; }
        h1 { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 20px; }
        h2 { font-size: 1.3rem; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        textarea, input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.8); color: var(--text-main); font-size: 1rem; outline: none; }
        .btn { padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-danger:hover { background: #ef4444; color: #fff; }

        .manage-post-item { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .post-actions { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">TheRoPlayer Tools</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/upload.html">Upload</a></li>
            <li><a href="/tos.html">Terms of Service</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <!-- Edit Bio Section -->
        <div class="settings-card">
            <h1>Account Settings</h1>
            <form id="bioForm">
                <div class="form-group">
                    <label>Edit Your Biography</label>
                    <textarea id="bioInput" rows="4" placeholder="Tell the community about yourself..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Biography</button>
            </form>
        </div>

        <!-- Manage Posts Section -->
        <div class="settings-card">
            <h2>Manage Your Posts</h2>
            <div id="user-posts-list">Loading your posts...</div>
        </div>
    </div>

    <!-- Edit Post Modal -->
    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(7,9,14,0.85); backdrop-filter:blur(8px); justify-content:center; align-items:center; z-index:2000; padding:20px;">
        <div style="background:#1e293b; border:1px solid var(--border); border-radius:20px; padding:30px; max-width:500px; width:100%;">
            <h2 style="margin-bottom:20px;">Edit Post</h2>
            <input type="hidden" id="edit-post-id">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="edit-desc" rows="4"></textarea>
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="saveEditPost()" class="btn btn-primary" style="flex:1;">Save Changes</button>
                <button onclick="closeEditModal()" class="btn" style="background:#334155; color:#fff; flex:1;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let myUserId = null;

        async function initSettings() {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();
            if (!meData.authenticated) {
                alert('You must be logged in.');
                window.location.href = '/auth/discord';
                return;
            }
            myUserId = meData.user.id;
            document.getElementById('bioInput').value = meData.user.bio || '';
            loadMyPosts();
        }

        document.getElementById('bioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bio = document.getElementById('bioInput').value;
            const res = await fetch('/api/user/bio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bio })
            });
            if (res.ok) alert('Biography updated successfully!');
        });

        async function loadMyPosts() {
            const res = await fetch(`/api/users/${myUserId}`);
            const data = await res.json();
            const list = document.getElementById('user-posts-list');
            
            if (data.posts.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted);">You haven\'t uploaded any posts yet.</p>';
                return;
            }

            list.innerHTML = '';
            data.posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'manage-post-item';
                div.innerHTML = `
                    <div>
                        <h4 style="margin-bottom: 4px;">${post.title}</h4>
                        <p style="color: var(--text-muted); font-size: 0.85rem;">${post.assetType === 'game' ? 'Game Asset' : 'Lua Script'}</p>
                    </div>
                    <div class="post-actions">
                        <button onclick="openEditModal('${post.id}', '${encodeURIComponent(post.title)}', '${encodeURIComponent(post.description)}')" class="btn btn-primary" style="padding: 8px 14px; font-size: 0.85rem;">Edit</button>
                        <button onclick="deletePost('${post.id}')" class="btn btn-danger" style="padding: 8px 14px; font-size: 0.85rem;">Delete</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openEditModal(id, title, desc) {
            document.getElementById('edit-post-id').value = id;
            document.getElementById('edit-title').value = decodeURIComponent(title);
            document.getElementById('edit-desc').value = decodeURIComponent(desc);
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveEditPost() {
            const id = document.getElementById('edit-post-id').value;
            const title = document.getElementById('edit-title').value;
            const description = document.getElementById('edit-desc').value;

            const res = await fetch(`/api/posts/${id}/edit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description })
            });

            if (res.ok) {
                closeEditModal();
                loadMyPosts();
            } else {
                alert('Failed to update post.');
            }
        }

        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            const res = await fetch(`/api/posts/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadMyPosts();
            } else {
                alert('Failed to delete post.');
            }
        }

        initSettings();
    </script>
</body>
</html>
