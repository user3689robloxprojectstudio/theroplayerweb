<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Tool | TheRoPlayer Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #07090e; --surface: rgba(30, 41, 59, 0.75); --primary: #38bdf8; --success: #22c55e; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .download-box { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px; max-width: 600px; width: 100%; text-align: center; }
        h1 { font-size: 2rem; color: var(--primary); margin-bottom: 15px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 14px; margin-bottom: 25px; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .btn-download {
            display: inline-block; width: 100%; padding: 16px; background: rgba(100, 116, 139, 0.2); color: #64748b;
            border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; border: none; cursor: not-allowed;
        }
        .btn-download.active { background: var(--success); color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <div class="download-box">
        <h1 id="tool-title">Generating Download</h1>
        <p id="timer-status">Preparing download link...</p>

        <div class="video-container" id="video-wrapper" style="display: none;">
            <iframe id="yt-iframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <button id="download-btn" class="btn-download" disabled>Please wait...</button>
        <br><br>
        <a href="/" style="color: var(--primary); text-decoration: none;">← Back to Main Page</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const toolId = urlParams.get('id');

        fetch(`/api/tools/${toolId}`)
            .then(res => res.json())
            .then(tool => {
                document.getElementById('tool-title').textContent = tool.title;
                const downloadBtn = document.getElementById('download-btn');
                const timerStatus = document.getElementById('timer-status');
                const videoWrapper = document.getElementById('video-wrapper');
                const ytIframe = document.getElementById('yt-iframe');

                // Check YouTube Video Configuration
                if (tool.youtubeUrl) {
                    const embedUrl = tool.youtubeUrl.replace("watch?v=", "embed/");
                    ytIframe.src = embedUrl;
                    videoWrapper.style.display = 'block';
                }

                let timeLeft = tool.timerDuration;

                if (timeLeft === 0) {
                    // Instant Download Selected
                    timerStatus.textContent = "Your download is ready!";
                    downloadBtn.disabled = false;
                    downloadBtn.classList.add('active');
                    downloadBtn.textContent = "Download Now";
                } else {
                    // Invisible or Status Countdown Timer based on Creator setting (Max 120s)
                    const countdown = setInterval(() => {
                        timeLeft--;
                        if (timeLeft <= 0) {
                            clearInterval(countdown);
                            timerStatus.textContent = "Your download is ready!";
                            downloadBtn.disabled = false;
                            downloadBtn.classList.add('active');
                            downloadBtn.textContent = "Download Now";
                        }
                    }, 1000);
                }

                downloadBtn.addEventListener('click', () => {
                    if (!downloadBtn.disabled) {
                        window.location.href = `/api/download/stream/${tool.id}`;
                    }
                });
            });
    </script>
</body>
</html>
