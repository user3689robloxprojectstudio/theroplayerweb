<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Tool | TheRoPlayer Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #07090e; --surface: rgba(30, 41, 59, 0.75); --primary: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(7, 9, 14, 0.85); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; padding: 18px 40px; z-index: 1000; }
        .nav-logo { font-size: 1.25rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 25px; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
        
        .main-content { max-width: 700px; width: 100%; margin: 120px auto 60px auto; padding: 0 20px; flex: 1; }
        .upload-card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 40px; }
        h1 { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 20px; text-align: center; }

        /* Tabs Header */
        .tabs-header { display: flex; gap: 10px; margin-bottom: 30px; background: rgba(15, 23, 42, 0.6); padding: 6px; border-radius: 14px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: #000; }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], textarea, select {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8); color: var(--text-main); font-size: 1rem; outline: none;
        }
        input[type="file"] { width: 100%; color: var(--text-muted); }
        .btn-submit {
            width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--primary);
            color: #000; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">TheRoPlayer Tools</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/upload.html" style="color: var(--primary);">Upload</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="upload-card">
            <h1>Upload Creation</h1>

            <!-- Tab Buttons -->
            <div class="tabs-header">
                <button type="button" class="tab-btn active" onclick="switchTab('game')">🎮 Upload Game (.rbxl)</button>
                <button type="button" class="tab-btn" onclick="switchTab('script')">📜 Upload Script (.lua)</button>
            </div>

            <form id="uploadForm" enctype="multipart/form-data">
                <input type="hidden" name="assetType" id="assetTypeInput" value="game">

                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" name="title" required placeholder="e.g. Advanced Combat System">
                </div>

                <div class="form-group">
                    <label>Description *</label>
                    <textarea name="description" rows="4" required placeholder="Explain how to use your asset/script..."></textarea>
                </div>

                <!-- Game Upload Tab Section -->
                <div id="section-game" class="form-section active">
                    <div class="form-group">
                        <label>Roblox Place File (.rbxl / .rbxm) *</label>
                        <input type="file" name="assetFile" id="gameFile">
                    </div>
                </div>

                <!-- Script Upload Tab Section -->
                <div id="section-script" class="form-section">
                    <div class="form-group">
                        <label>Lua Script File (.lua / .txt) *</label>
                        <input type="file" name="assetFile" id="scriptFile" accept=".lua,.txt">
                    </div>
                </div>

                <div class="form-group">
                    <label>Preview Image</label>
                    <input type="file" name="image" accept="image/*">
                </div>

                <div class="form-group">
                    <label>YouTube Video Link (Optional)</label>
                    <input type="text" name="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
                </div>

                <div class="form-group">
                    <label>Download Wait Timer Choice *</label>
                    <select name="timerDuration">
                        <option value="0">Instant Download (No Wait Time)</option>
                        <option value="15">15 Seconds Wait</option>
                        <option value="30">30 Seconds Wait</option>
                        <option value="60">60 Seconds Wait (Default)</option>
                        <option value="120">120 Seconds (2 Minutes Max Wait)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Publish Asset</button>
            </form>
        </div>
    </div>

    <script>
        fetch('/api/me').then(res => res.json()).then(data => {
            if (!data.authenticated) {
                alert('You must be logged in with Discord to upload!');
                window.location.href = '/auth/discord';
            }
        });

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            
            document.getElementById('assetTypeInput').value = type;
            
            if (type === 'game') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('section-game').classList.add('active');
                document.getElementById('gameFile').required = true;
                document.getElementById('scriptFile').required = false;
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('section-script').classList.add('active');
                document.getElementById('scriptFile').required = true;
                document.getElementById('gameFile').required = false;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const res = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.success) {
                alert('Uploaded successfully!');
                window.location.href = data.downloadUrl;
            } else {
                alert('Upload failed: ' + data.error);
            }
        });
    </script>
</body>
</html>
