<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Banned</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #07090e; --surface: rgba(30, 41, 59, 0.7); --primary: #38bdf8; --danger: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .card { background: var(--surface); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 24px; padding: 50px; max-width: 500px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        h1 { font-size: 2.2rem; font-weight: 800; color: var(--danger); margin-bottom: 15px; }
        p { color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 30px; }
        .btn { padding: 12px 24px; border-radius: 12px; background: rgba(255, 255, 255, 0.1); color: #fff; text-decoration: none; font-weight: 700; transition: 0.3s; }
        .btn:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚫 Access Denied</h1>
        <p>Your account has been banned by an administrator for violating community guidelines. You cannot access this platform until an admin reviews and lifts your ban.</p>
        <a href="/logout" class="btn">Logout / Switch Account</a>
    </div>
</body>
</html>
