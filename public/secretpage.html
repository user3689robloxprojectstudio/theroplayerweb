<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE // ROOT ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --terminal-green: #00ff66;
            --terminal-dark: #050b07;
            --terminal-glow: rgba(0, 255, 102, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--terminal-dark);
            color: var(--terminal-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
        }

        /* CRT Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .terminal-header {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 0.85rem;
            color: rgba(0, 255, 102, 0.6);
            letter-spacing: 1px;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 1.05rem;
            text-shadow: 0 0 8px var(--terminal-glow);
            scroll-behavior: smooth;
        }

        .line {
            line-height: 1.4;
            word-break: break-all;
        }

        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }

        .prompt {
            color: var(--terminal-green);
            font-weight: bold;
        }

        #commandInput {
            background: transparent;
            border: none;
            color: var(--terminal-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            outline: none;
            flex: 1;
            text-shadow: 0 0 8px var(--terminal-glow);
        }

        .accent { color: #fff; text-shadow: 0 0 10px #fff; }
        .danger { color: #ff3333; text-shadow: 0 0 10px rgba(255, 51, 51, 0.6); }
    </style>
</head>
<body>

    <div class="terminal-header">
        SYSTEM SECURE ROOT // NODE.JS CLOUD CACHE OVERRIDE [RESTRICTED ACCESS]
    </div>

    <div id="output">
        <div class="line">Initializing secure encrypted tunnel... [OK]</div>
        <div class="line">Bypassing firewall filters... [OK]</div>
        <div class="line accent">WELCOME, ADMINISTRATOR. Type <span class="danger">'help'</span> for available backdoor commands.</div>
        <br>
    </div>

    <div class="input-line">
        <span class="prompt">root@theroplayer:~#</span>
        <input type="text" id="commandInput" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const input = document.getElementById('commandInput');
        const output = document.getElementById('output');

        function appendLine(htmlContent) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = htmlContent;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        input.addEventListener('keydown', async function(e) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();
                if (!cmd) return;

                appendLine(`<span class="prompt">root@theroplayer:~#</span> ${cmd}`);
                input.value = '';

                const args = cmd.toLowerCase().split(' ');
                const action = args[0];

                switch(action) {
                    case 'help':
                        appendLine('AVAILABLE COMMANDS:');
                        appendLine('  <span class="accent">help</span>          - Display this help menu');
                        appendLine('  <span class="accent">status</span>        - Check cloud cache connection state');
                        appendLine('  <span class="accent">users</span>         - Dump active user cache count');
                        appendLine('  <span class="accent">clear</span>         - Clear terminal screen');
                        appendLine('  <span class="accent">exit</span>          - Return to public platform index');
                        break;

                    case 'status':
                        appendLine('CLOUD CACHE: <span class="accent">ONLINE</span> (cloud_cache.json synced)');
                        appendLine('USERS CACHE: <span class="accent">SECURE</span> (users_cache.json operational)');
                        break;

                    case 'users':
                        try {
                            const res = await fetch('/api/admin/users');
                            if (res.ok) {
                                const users = await res.json();
                                appendLine(`Active registered accounts in cache: <span class="accent">${Object.keys(users).length}</span>`);
                            } else {
                                appendLine('<span class="danger">Access Denied: Admin privileges required to dump user cache.</span>');
                            }
                        } catch {
                            appendLine('<span class="danger">Error communicating with server node.</span>');
                        }
                        break;

                    case 'clear':
                        output.innerHTML = '';
                        break;

                    case 'exit':
                        appendLine('Closing secure session...');
                        setTimeout(() => { window.location.href = '/'; }, 1000);
                        break;

                    default:
                        appendLine(`<span class="danger">Command not recognized: '${action}'. Type 'help' for commands.</span>`);
                        break;
                }
            }
        });

        // Keep input focused if user clicks anywhere in the window
        document.addEventListener('click', () => input.focus());
    </script>
</body>
</html>
